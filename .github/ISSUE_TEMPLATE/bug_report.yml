name: Bug report / 缺陷报告
description: Report reproducible incorrect behavior / 报告可复现的异常行为
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NOVA Desktop. Please do not disclose security vulnerabilities here; use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Screenshots, logs, paths with private information removed, or other useful details.
